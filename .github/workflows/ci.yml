name: CI

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main, develop, feat/*]

env:
  NODE_VERSION: "20"

jobs:
  # Quality Gates
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Why: prisma CLI is a devDependency of @omnysync/core, schema lives in
        # omnysync-web. Without this, tsc cannot see the generated models
        # ('Property X does not exist on PrismaClient') because each CI job
        # runs on a fresh VM and the test job's generation does not persist.
        run: pnpm --filter @omnysync/core exec prisma generate --schema=../../omnysync-web/prisma/schema.prisma

      - name: Type check
        # Note: Scoped to @omnysync/core — le web source cleanup (258 erreurs)
        # est un effort separe. Ci-dessous les stats actuelles :
        #   core: 0 erreurs (passe)
        #   web:  258 erreurs preexistantes (source, non-test)
        run: pnpm --filter @omnysync/core exec tsc --incremental --noEmit

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Why: prisma CLI is a devDependency of @omnysync/core, schema lives in omnysync-web
        run: pnpm --filter @omnysync/core exec prisma generate --schema=../../omnysync-web/prisma/schema.prisma

      - name: Run tests with coverage
        run: pnpm vitest run --coverage
        env:
          NEXTAUTH_SECRET: test-secret-ci
          NEXTAUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars!
          ENCRYPTION_SALT: test-salt-ci-16chars
          OAUTH_ENCRYPTION_KEY: test-oauth-key-for-ci-32chars!!

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        # Non-blocking: this repo has no CODECOV_TOKEN secret configured, so the
        # upload cannot authenticate and would otherwise fail the whole pipeline.
        # Coverage reporting is auxiliary; re-enable strict failure once the
        # CODECOV_TOKEN secret is added.
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    # Generous timeout: core's tsup dts type-check alone takes ~10 min, plus
    # next build. Fails fast on a true hang (e.g. missing network/service).
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Why: next build (web) imports @omnysync/core/prisma, whose client must
        # be generated into core's node_modules on this fresh VM.
        run: pnpm --filter @omnysync/core exec prisma generate --schema=../../omnysync-web/prisma/schema.prisma

      - name: Sync core's Prisma Client copy
        # Why: pnpm keeps @omnysync/core and omnysync-web on separate
        # @prisma/client copies. `prisma generate` writes the client to the
        # shared generated dir (omnysync-web/prisma/generated/client) but does
        # NOT fill core's own node_modules copy (pnpm's virtual store is
        # read-only). tsup type-checks core's source against core's own
        # @prisma/client copy, which would otherwise be the UNGENERATED stub and
        # fail dts generation. Mirror the freshly generated shared client into
        # core's copy so tsup resolves a real client.
        run: |
          CORE_CLIENT=$(node -e "console.log(require('path').dirname(require.resolve('@prisma/client/package.json',{paths:['packages/omnysync-core']})))")
          SHARED_CLIENT="$PWD/omnysync-web/prisma/generated/client"
          rm -rf "$CORE_CLIENT/.prisma"
          mkdir -p "$CORE_CLIENT/.prisma/client"
          cp -r "$SHARED_CLIENT/." "$CORE_CLIENT/.prisma/client/"
          echo "Synced @prisma/client: $SHARED_CLIENT -> $CORE_CLIENT/.prisma/client"

      - name: Push database schema
        # Why: next build (web) may prerender pages that query the database at
        # build time. Provide a real Postgres (service above) + schema so the
        # build does not hang/fail on a missing DB.
        run: pnpm --filter @omnysync/core exec prisma db push --schema=../../omnysync-web/prisma/schema.prisma --url="$DATABASE_URL" --accept-data-loss
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        # Why: Next.js forces NODE_ENV=production during next build, so the
        # env.ts Zod validation runs its production checks. All required
        # env vars must be present at build time.
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-build-secret-not-for-production-min-32-chars!
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-build-id
          GOOGLE_CLIENT_SECRET: ci-build-secret
          # Dummy keys: next build only evaluates route modules (collect page
          # data) and never calls external APIs, but SDK clients instantiated at
          # module top-level (Stripe routes) require a non-empty apiKey.
          STRIPE_SECRET_KEY: sk_test_ci_build_dummy_key_not_a_real_key
          RESEND_API_KEY: re_ci_build_dummy_key_not_a_real_key
          OPENAI_API_KEY: sk-ci-build-dummy-not-a-real-key
          ENCRYPTION_KEY: ci-build-encryption-key-not-for-production-32+chars
          ENCRYPTION_SALT: ci-build-salt-not-for-prod-16+


